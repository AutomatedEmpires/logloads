name: Agent Handoff

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print repo handoff summary
        run: |
          echo "## Repo status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation: pnpm install --frozen-lockfile && pnpm validate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database check: pnpm db:check" >> "$GITHUB_STEP_SUMMARY"

      - name: Print terminal-friendly summary
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Run: pnpm install --frozen-lockfile && pnpm validate"
          echo "Optional DB check: pnpm db:check"