name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  ci:
    uses: AutomatedEmpires/.github/.github/workflows/reusable-ci.yml@main
    secrets: inherit

  extended-validation:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Validate database migrations
        run: pnpm db:assert

      - name: Guardrails
        run: pnpm guardrails

      - name: Build production application
        run: pnpm --filter @logloads/web build

      - name: Install Playwright browsers
        id: playwright-browsers
        run: pnpm --filter @logloads/web exec playwright install --with-deps chromium

      - name: End-to-end smoke
        run: pnpm test:e2e
        env:
          CI: "true"

      # The pilot config keeps the trace of every failed attempt, including the first attempt of a test that passes on
      # retry, so a CI-only flake can be read instead of guessed at (#153, #159). A clean run leaves no trace, so
      # nothing is uploaded. Like the DS-05 traces, they hold only this job's disposable stack and seeded demo accounts.
      - name: Upload pilot E2E traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pilot-e2e-traces
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # DS-05 (#148): reuses this job's build, browsers and Supabase stack, with Marketplace V2 on its own port.
      # It runs even when the pilot journeys above fail, so each suite reports its own result.
      - name: Design-system regression
        id: design-system
        if: ${{ !cancelled() && steps.playwright-browsers.outcome == 'success' }}
        run: pnpm test:e2e:design-system
        env:
          CI: "true"

      # Playwright keeps a trace of each failed DS-05 case (design-system.config.mjs); upload them so a CI-only failure
      # can be read. They hold only this job's disposable local stack and seeded demo accounts.
      - name: Upload design-system traces
        if: ${{ !cancelled() && steps.design-system.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: design-system-traces
          path: apps/web/tests/test-results/design-system/
          retention-days: 7
