name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  ci:
    uses: AutomatedEmpires/.github/.github/workflows/reusable-ci.yml@main
    secrets: inherit

  extended-validation:
    needs: ci
    runs-on: ubuntu-latest
    # A clean run takes about 16 minutes. The limits below stop a hung step long before this one (#323); this is the
    # backstop, so a stuck job no longer holds a PR for the default 6 hours.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # tools/db-check.sh retries the stack start up to 3 times from a clean slate, never the migrations or checks.
      - name: Validate database migrations
        timeout-minutes: 15
        run: pnpm db:assert

      - name: Guardrails
        run: pnpm guardrails

      - name: Build production application
        timeout-minutes: 15
        run: pnpm --filter @logloads/web build

      # The browser comes from the cache when this Playwright version has run before. The system packages still come
      # from apt, whose mirrors sometimes fail to resolve; the install is retried up to 3 times (#323).
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @logloads/web exec playwright --version | awk '{print $NF}')" >>"$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        id: playwright-browsers
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if pnpm --filter @logloads/web exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright install attempt ${attempt} of 3 failed."
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 20))
              sudo apt-get update || true
            fi
          done
          exit 1

      # Playwright stops a broken run after 5 failed tests or 15 minutes (tests/playwright.config.mjs); the step limit
      # covers the server start and the Supabase readiness wait on top.
      - name: End-to-end smoke
        id: e2e
        timeout-minutes: 20
        run: pnpm test:e2e
        env:
          CI: "true"

      # The pilot config keeps the trace of every failed attempt, including the first attempt of a test that passes on
      # retry, so a CI-only flake can be read instead of guessed at (#153, #159). Only the traces and error contexts
      # are uploaded (the journeys also save screenshots on every run), so a clean run uploads nothing. Like the DS-05
      # traces, they hold only this job's disposable stack and seeded demo accounts.
      - name: Upload pilot E2E traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pilot-e2e-traces
          path: |
            apps/web/test-results/**/trace.zip
            apps/web/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7

      # The server's own output (tools/e2e-server.mjs), including any request it left unanswered for 20 s, when the
      # journeys failed or ran out of time. It holds only this job's disposable stack and seeded demo accounts.
      - name: Upload pilot E2E server log
        if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pilot-e2e-server-log
          path: apps/web/test-results/server.log
          if-no-files-found: ignore
          retention-days: 7

      # DS-05 (#148): reuses this job's build, browsers and Supabase stack, with Marketplace V2 on its own port.
      # It runs even when the pilot journeys above fail, so each suite reports its own result.
      - name: Design-system regression
        id: design-system
        if: ${{ !cancelled() && steps.playwright-browsers.outcome == 'success' }}
        timeout-minutes: 15
        run: pnpm test:e2e:design-system
        env:
          CI: "true"

      # Playwright keeps a trace of each failed DS-05 case (design-system.config.mjs); upload them so a CI-only failure
      # can be read, with the server's log. They hold only this job's disposable local stack and seeded demo accounts.
      - name: Upload design-system traces
        if: ${{ !cancelled() && steps.design-system.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: design-system-traces
          path: apps/web/tests/test-results/design-system/
          retention-days: 7
