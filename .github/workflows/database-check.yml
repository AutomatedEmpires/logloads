name: Database Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Check migrations
        run: pnpm db:check

      # #113: back up, wipe and restore the canonical operating-state document on the disposable local stack that
      # db:check just reset, through the operator CLI and the application's read path. Local only: no hosted
      # project, no access token, no repository secret. See docs/RECOVERY.md section 7.
      - name: Rehearse operating-state backup and restore
        run: bash tools/operating-state-rehearsal/run.sh
