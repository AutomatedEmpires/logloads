name: Normalized V2 Adapter Contract CI

# Contract tests of the normalized MarketplaceV2Port adapter (apps/web/lib/marketplace-v2/normalized-*.ts, #139)
# against the real architecture/normalized-v2 schema. The migration chain 01 -> 02 -> 03 -> 06 -> 11 -> 12 -> 16 -> 18 -> 23 is
# applied to a disposable PostgreSQL 17 + PostGIS service container created inside the job, behind the same
# fail-closed guard as the Normalized V2 Database CI (tools/normalized-v2-ci/guard.sh). Then the adapter runs over a
# restricted NOINHERIT login role, exactly as a deployment would connect. No hosted database, Supabase project,
# Vercel environment or credential is used or needed.

on:
  pull_request:
    paths:
      - apps/web/lib/marketplace-v2/**
      - packages/contracts/src/marketplace*.ts
      - architecture/normalized-v2/**
      - tools/normalized-v2-ci/**
      - .github/workflows/normalized-adapter-ci.yml
      - apps/web/package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: normalized-adapter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-contract:
    name: Normalized adapter contract (PostgreSQL 17, fresh database)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # postgis/postgis:17-3.5 (PostgreSQL 17, PostGIS 3.5), pinned by index digest, as in normalized-v2-ci.yml.
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # CI-only credential for a throwaway service container.
          POSTGRES_DB: logloads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d logloads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      LOGLOADS_DISPOSABLE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/logloads_test
      LOGLOADS_DB_ENV: ci-disposable
      LOGLOADS_CI_ITERATION: "1"
      PGCONNECT_TIMEOUT: "10"
      # Bound every statement and lock wait so a deadlock or stuck session cannot hang CI.
      PGOPTIONS: "-c lock_timeout=30s -c statement_timeout=300s -c idle_in_transaction_session_timeout=120s"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install PostgreSQL 17 client
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Wait for the service to finish initialization
        timeout-minutes: 3
        run: |
          set -euo pipefail
          psql --version
          # The PostGIS image runs init scripts on a socket-only server, then restarts on TCP.
          # Require three consecutive successful TCP queries before continuing.
          ok=0
          for _ in $(seq 1 60); do
            if psql "$LOGLOADS_DISPOSABLE_DB_URL" -X -q -t -A -c "select 1" >/dev/null 2>&1; then
              ok=$((ok + 1)); [[ $ok -ge 3 ]] && break
            else
              ok=0
            fi
            sleep 2
          done
          [[ $ok -ge 3 ]] || { echo "database service never became stable" >&2; exit 1; }
          psql "$LOGLOADS_DISPOSABLE_DB_URL" -X -q -t -A -c "select version();"

      - name: Guard and provision disposable database
        run: bash tools/normalized-v2-ci/guard.sh provision

      - name: "Stage 1: 01_schema.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 1

      - name: "Stage 2: 02_access.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 2

      - name: "Stage 3: 03_entitlements.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 3

      - name: "Stage 6: 06_v2_contract_alignment.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 6

      - name: "Stage 11: 11_v2_phase3_policy.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 11

      - name: "Stage 12: 12_v2_billing_events.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 12

      - name: "Stage 16: 16_v2_identity_membership_hardening.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 16

      - name: "Stage 18: 18_v2_review_106_hardening.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 18

      - name: "Stage 23: 23_v2_round2_hardening.sql"
        timeout-minutes: 5
        run: bash tools/normalized-v2-ci/run-stage.sh 23

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-verify the disposable database before the adapter writes fixtures
        run: bash tools/normalized-v2-ci/guard.sh verify

      - name: Adapter contract tests (normalized-adapter.contract.test.ts)
        timeout-minutes: 10
        env:
          # A missing or unguarded database fails these tests instead of skipping them.
          LOGLOADS_ADAPTER_CONTRACT: required
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/normalized-v2-ci/logs"
          pnpm --filter @logloads/web exec vitest run lib/marketplace-v2/normalized-adapter.contract.test.ts \
            --testTimeout=60000 --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/normalized-v2-ci/logs/adapter-contract.log"
          {
            echo "### Normalized adapter contract tests"
            echo '```'
            grep -E "✓|✗|×|Test Files|Tests " "$RUNNER_TEMP/normalized-v2-ci/logs/adapter-contract.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect database server log
        if: failure()
        run: |
          set +e
          cid="$(docker ps -q --filter "ancestor=postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6" | head -1)"
          [[ -z "$cid" ]] && cid="$(docker ps -q | head -1)"
          mkdir -p "$RUNNER_TEMP/normalized-v2-ci/logs"
          docker logs "$cid" > "$RUNNER_TEMP/normalized-v2-ci/logs/postgres-server.log" 2>&1
          tail -n 80 "$RUNNER_TEMP/normalized-v2-ci/logs/postgres-server.log"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: normalized-adapter-ci-logs
          path: ${{ runner.temp }}/normalized-v2-ci/logs/
          retention-days: 7
