name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Dependency review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Write dependency review summary
        if: always()
        run: |
          if [[ "${{ steps.review.outcome }}" == "success" ]]; then
            {
              echo "## Dependency review"
              echo "- Result: success"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Dependency review"
              echo "- Result: skipped"
              echo "- Reason: GitHub reports dependency review is not supported for this repository until the required dependency graph or security settings are enabled."
            } >> "$GITHUB_STEP_SUMMARY"
          fi